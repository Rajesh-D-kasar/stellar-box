[package]
name = "stellar-crowdfunding-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.4"

[dev-dependencies]
soroban-sdk = { version = "27.0.4", features = ["testutils"] }

[patch.crates-io]
ethnum = { path = "./ethnum_patch" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
